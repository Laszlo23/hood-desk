[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
robinhood = "${RPC_URL}"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", url = "https://robinscout.gitlawb.com/api" }
