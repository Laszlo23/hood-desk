[profile.default]
src = "src"
out = "out"
libs = ["lib", "../lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
robinhood = "${RPC_URL}"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", url = "https://robinhoodchain.blockscout.com/api" }
