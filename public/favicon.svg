<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HOOD agent">
  <defs>
    <radialGradient id="hg" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1a2200"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fbf00"/>
      <stop offset="35%" stop-color="#ccff00"/>
      <stop offset="65%" stop-color="#e8ff66"/>
      <stop offset="100%" stop-color="#8fbf00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#hg)"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#ccff00" stroke-opacity="0.55" stroke-width="1.25"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ccff00" stroke-opacity="0.18" stroke-width="0.75"/>
  <!-- hood silhouette -->
  <path d="M18 40 C18 22 24 14 32 14 C40 14 46 22 46 40 L42 44 C40 30 36 24 32 24 C28 24 24 30 22 44 Z" fill="#0c0c0c" stroke="#1f1f1f" stroke-width="0.5"/>
  <path d="M22 38 C23 28 27 25 32 25 C37 25 41 28 42 38" fill="none" stroke="#ccff00" stroke-opacity="0.22" stroke-width="1"/>
  <!-- face void -->
  <ellipse cx="32" cy="33" rx="8.5" ry="7" fill="#050505"/>
  <!-- neon visor line -->
  <path d="M24.5 33.2 L28 32.4 L32 34.1 L36 32.4 L39.5 33.2" fill="none" stroke="url(#visor)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- circuit collar -->
  <path d="M20 44 H44" stroke="#ccff00" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M24 44 V48 M32 44 V50 M40 44 V48" stroke="#ccff00" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="24" cy="48" r="1.3" fill="#ccff00"/>
  <circle cx="32" cy="50" r="1.5" fill="#ccff00"/>
  <circle cx="40" cy="48" r="1.3" fill="#ccff00"/>
  <path d="M24 48 H32 H40" stroke="#ccff00" stroke-opacity="0.35" stroke-width="0.8"/>
</svg>
