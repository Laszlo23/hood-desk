    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#forest-gradient)"/>
  
  <circle cx="200" cy="180" r="80" fill="#CCFF00" opacity="0.15" filter="url(#glow)"/>
  
  <path d="M 200 120 L 220 140 L 210 140 L 210 200 L 190 200 L 190 140 L 180 140 Z" fill="#CCFF00" opacity="0.8"/>
  
  <ellipse cx="180" cy="190" rx="35" ry="40" fill="#8B4513" opacity="0.7"/>
